  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Tiro Devanagari Sanskrit', serif;
      background: #f5f0e8;
    }

    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      display: flex;
      justify-content: center;
      gap: 40px;
      padding: 16px 40px;
      background: rgba(30, 51, 41, 0.96);
      backdrop-filter: blur(8px);
      z-index: 100;
      border-bottom: 1px solid rgba(168, 197, 160, 0.2);
    }

    nav a {
      font-family: 'Tiro Devanagari Sanskrit', serif;
      font-size: 13px;
      color: #a8c5a0;
      text-decoration: none;
      letter-spacing: 0.06em;
      transition: color 0.2s;
    }

    nav a:hover { color: #f5f0e8; }
    nav a.active { color: #ffffff; font-weight: 500; }

    #tree-wrap {
      position: fixed;
      top: 52px; bottom: 40px;
      left: 0; right: 0;
      overflow: auto;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 24px;
    }

    #tree-canvas {
      position: relative;
      transform-origin: top center;
    }

    /* Legend */
    .legend {
      position: fixed;
      top: 68px;
      left: 16px;
      background: rgba(245,240,232,0.95);
      border: 1px solid #d4b896;
      border-radius: 6px;
      padding: 10px 14px;
      z-index: 99;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #2d4a3e;
    }

    .legend-dot {
      width: 14px; height: 14px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    /* Zoom controls */
    .zoom-controls {
      position: fixed;
      bottom: 56px;
      right: 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 99;
    }

    .zoom-btn {
      width: 34px; height: 34px;
      background: #2d4a3e;
      color: #f5f0e8;
      border: none;
      border-radius: 4px;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .zoom-btn:hover { background: #1e3329; }
    .zoom-fit { font-size: 10px; letter-spacing: 0.04em; }

    footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      text-align: center;
      padding: 10px 24px;
      background: #1e3329;
      border-top: 1px solid rgba(168,197,160,0.15);
      z-index: 100;
    }

    .footer-main {
      font-family: 'Tiro Devanagari Sanskrit', serif;
      font-size: 12px;
      color: #a8c5a0;
      letter-spacing: 0.04em;
    }

    .footer-creator {
      font-family: 'Tiro Devanagari Sanskrit', serif;
      font-size: 12px;
      color: #a8c5a0;
      text-decoration: none;
      transition: color 0.2s;
    }

    .footer-creator:hover { color: #f5f0e8; }

    /* Tree nodes */
    .node {
      position: absolute;
      width: 130px;
      padding: 8px 10px;
      border-radius: 5px;
      text-align: center;
      font-family: 'Tiro Devanagari Sanskrit', serif;
      font-size: 12px;
      line-height: 1.4;
      cursor: pointer;
      transition: box-shadow 0.2s, transform 0.2s;
      border-width: 2px;
      border-style: solid;
      z-index: 2;
      user-select: none;
    }

    .node:hover { box-shadow: 0 4px 14px rgba(30,51,41,0.18); transform: translateY(-1px); }

    .node.founder    { background: #fff3e0; border-color: #c8843c; }
    .node.son        { background: #e8f4f0; border-color: #4a7c6e; }
    .node.daughter   { background: #f0f7ee; border-color: #a8c5a0; }
    .node.son-in-law { background: #fdf6ee; border-color: #d4b896; }
    .node.dau-in-law { background: #eef4f0; border-color: #2d4a3e; }
    .node.unknown    { background: #f5f0e8; border-color: #c8c0b0; border-style: dashed; }
    .node.deceased   { background: #f0ece8; border-color: #a09080; opacity: 0.75; }
    .node.creator    { background: #fff3e0; border-color: #c8843c; box-shadow: 0 0 0 3px rgba(200,132,60,0.25); }
    .node.cousin-marker { font-size: 10px; }

    .node-name { font-weight: 500; color: #1e3329; }
    .node-tag  { font-size: 10px; color: #4a7c6e; margin-top: 2px; }

    /* Connector lines via SVG overlay */
    #lines-svg {
      position: absolute;
      top: 0; left: 0;
      pointer-events: none;
      z-index: 1;
      overflow: visible;
    }

    line, path {
      stroke: #a8c5a0;
      stroke-width: 1.5;
      fill: none;
    }

    line.cousin-link {
      stroke: #c8843c;
      stroke-width: 1.5;
      stroke-dasharray: 4 3;
    }
  </style>

        spouse: { id: 'ngv', name: 'Nagaveni', cls: C.dil },
        children: [
          {
            id: 'vkr', name: 'Vikram', cls: C.son,
            spouse: { id: 'vid', name: 'Vidya', cls: C.dil },
            children: [
              { id: 'anp', name: 'Anupama ✦', cls: C.creator, tag: 'Creator of Website' }
            ]
          }
        ]
      }
    ]
  };

  // ── LAYOUT ENGINE ───────────────────────────────────────────────────────────
  const canvas  = document.getElementById('tree-canvas');
  const svg     = document.getElementById('lines-svg');
  const wrap    = document.getElementById('tree-wrap');
  let   scale   = 1;
  const positions = {};   // id → {x, y, w, h}
  const cousinLinks = []; // [{from, to}]

  function nodeH(person) {
    return person.tag ? 60 : NH;
  }

  // Returns width of subtree rooted at person (including spouse side-by-side)
  function subtreeWidth(person) {
    const coupleW = person.spouse ? NW * 2 + GAP_X : NW;
    if (!person.children || person.children.length === 0) return coupleW;
    const childrenW = person.children.reduce((sum, c) => sum + subtreeWidth(c), 0)
                    + (person.children.length - 1) * GAP_X;
    return Math.max(coupleW, childrenW);
  }

  function place(person, x, y) {
    const sw   = subtreeWidth(person);
    const cx   = x + sw / 2; // centre of subtree
    const h    = nodeH(person);

    // Place person node centred
    const px = cx - NW / 2;
    positions[person.id] = { x: px, y, w: NW, h };

    // Place spouse to the right
    if (person.spouse) {
      positions[person.spouse.id] = { x: px + NW + GAP_X, y, w: NW, h };
    }

    // Collect cousin links
    if (person.cousinSpouseId) {
      cousinLinks.push({ from: person.id, to: person.cousinSpouseId });
    }

    // Place children
    if (person.children && person.children.length > 0) {
      const childY = y + h + GAP_Y;
      let childX   = x;
      for (const child of person.children) {
        place(child, childX, childY);
        childX += subtreeWidth(child) + GAP_X;
      }
    }
  }

  function createNode(person) {
    const pos  = positions[person.id];
    const div  = document.createElement('div');
    div.className = 'node ' + person.cls;
    div.id        = person.id === 'anp' ? 'creator' : person.id;
    div.style.left   = pos.x + 'px';
    div.style.top    = pos.y + 'px';
    div.style.width  = NW + 'px';
    div.style.minHeight = pos.h + 'px';
    div.innerHTML = `<div class="node-name">${person.name}</div>${person.tag ? `<div class="node-tag">${person.tag}</div>` : ''}`;
    canvas.appendChild(div);

    if (person.spouse && positions[person.spouse.id]) {
      const sp   = person.spouse;
      const spos = positions[sp.id];
      const sdiv = document.createElement('div');
      sdiv.className = 'node ' + sp.cls;
      sdiv.id        = sp.id;
      sdiv.style.left   = spos.x + 'px';
      sdiv.style.top    = spos.y + 'px';
      sdiv.style.width  = NW + 'px';
      sdiv.style.minHeight = spos.h + 'px';
      sdiv.innerHTML = `<div class="node-name">${sp.name}</div>`;
      canvas.appendChild(sdiv);
    }

    if (person.children) {
      for (const child of person.children) createNode(child);
    }
  }

  function drawLines(person) {
    const pos = positions[person.id];
    if (!pos) return;

    // Line between person and spouse
    if (person.spouse && positions[person.spouse.id]) {
      const sp = positions[person.spouse.id];
      addLine(pos.x + NW, pos.y + pos.h / 2, sp.x, sp.y + sp.h / 2);
    }

    // Lines to children
    if (person.children && person.children.length > 0) {
      const parentMidX = pos.x + NW / 2 + (person.spouse ? (NW + GAP_X) / 2 : 0);
      const parentBottomY = pos.y + pos.h;
      const midY = parentBottomY + GAP_Y / 2;

      for (const child of person.children) {
        const cpos = positions[child.id];
        if (!cpos) continue;
        const childMidX = cpos.x + NW / 2;
        // Vertical from parent down to midY
        addLine(parentMidX, parentBottomY, parentMidX, midY);
        // Horizontal to child midX
        addLine(parentMidX, midY, childMidX, midY);
        // Vertical down to child
        addLine(childMidX, midY, childMidX, cpos.y);
        drawLines(child);
      }
    }
  }

  function addLine(x1, y1, x2, y2, cls) {
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', x1); line.setAttribute('y1', y1);
    line.setAttribute('x2', x2); line.setAttribute('y2', y2);
    if (cls) line.setAttribute('class', cls);
    svg.appendChild(line);
  }

  function drawCousinLinks() {
    for (const link of cousinLinks) {
      const a = positions[link.from];
      const b = positions[link.to];
      if (!a || !b) continue;
      // Dashed line between the two cousin-marriage nodes
      addLine(a.x + NW / 2, a.y + a.h, b.x + NW / 2, b.y + b.h, 'cousin-link');
    }
  }

  function render() {
    // Clear
    canvas.innerHTML = '<svg id="lines-svg"></svg>';
    const svgEl = document.getElementById('lines-svg');

    // Layout
    place(tree, 0, 0);

    // Find canvas size
    let maxX = 0, maxY = 0;
    for (const pos of Object.values(positions)) {
      maxX = Math.max(maxX, pos.x + pos.w);
      maxY = Math.max(maxY, pos.y + pos.h);
    }
    canvas.style.width  = (maxX + 40) + 'px';
    canvas.style.height = (maxY + 40) + 'px';
    svgEl.setAttribute('width',  maxX + 40);
    svgEl.setAttribute('height', maxY + 40);

    // Draw nodes
    createNode(tree);

    // Draw lines
    drawLines(tree);
    drawCousinLinks();
  }

  // ── ZOOM ────────────────────────────────────────────────────────────────────
  function applyScale() {
    canvas.style.transform = `scale(${scale})`;
  }

  function zoomIn()  { scale = Math.min(scale + 0.1, 2);   applyScale(); }
  function zoomOut() { scale = Math.max(scale - 0.1, 0.2); applyScale(); }

  function zoomFit() {
    const ww = wrap.clientWidth  - 48;
    const wh = wrap.clientHeight - 48;
    const cw = parseFloat(canvas.style.width);
    const ch = parseFloat(canvas.style.height);
    scale = Math.min(ww / cw, wh / ch, 1);
    applyScale();
    canvas.style.transformOrigin = 'top left';
  }

  // ── INIT ────────────────────────────────────────────────────────────────────
  render();
  setTimeout(zoomFit, 100);

  // Scroll to creator node if hash
  if (location.hash === '#creator') {
    setTimeout(() => {
      const el = document.getElementById('creator');
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 300);
  }
  </script>

</body>
