  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Tiro+Devanagari+Sanskrit:ital@0;1&display=swap" rel="stylesheet" media="print" onload="this.media='all'"/>
  <noscript><link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Tiro+Devanagari+Sanskrit:ital@0;1&display=swap" rel="stylesheet"/></noscript>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Tiro Devanagari Sanskrit', serif;
      background: #f5f0e8;
    }

    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      display: flex;
      justify-content: center;
      gap: 40px;
      padding: 16px 40px;
      background: rgba(30, 51, 41, 0.96);
      backdrop-filter: blur(8px);
      z-index: 100;
      border-bottom: 1px solid rgba(168, 197, 160, 0.2);
    }

    nav a {
      font-family: 'Tiro Devanagari Sanskrit', serif;
      font-size: 13px;
      color: #a8c5a0;
      text-decoration: none;
      letter-spacing: 0.06em;
      transition: color 0.2s;
    }

    nav a:hover { color: #f5f0e8; }
    nav a.active { color: #ffffff; font-weight: 500; }

    #viewport {
      position: fixed;
      top: 52px; bottom: 40px;
      left: 0; right: 0;
      overflow: auto;
    }

    #stage {
      position: relative;
      min-width: 100%;
      min-height: 100%;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 60px 40px 80px;
    }

    #tree-root {
      position: relative;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      transform-origin: top center;
    }

    /* ── COUPLE ROW ── */
    .couple-row {
      display: flex;
      align-items: center;
      gap: 0;
      position: relative;
    }

    .couple-connector {
      width: 24px;
      height: 2px;
      background: #a8c5a0;
      flex-shrink: 0;
    }

    /* ── NODE ── */
    .node {
      width: 130px;
      padding: 8px 10px;
      border-radius: 5px;
      text-align: center;
      font-family: 'Tiro Devanagari Sanskrit', serif;
      font-size: 12px;
      line-height: 1.4;
      border-width: 2px;
      border-style: solid;
      user-select: none;
      position: relative;
    }

    .node.clickable {
      cursor: pointer;
      transition: box-shadow 0.2s, transform 0.2s;
    }

    .node.clickable:hover {
      box-shadow: 0 4px 14px rgba(30,51,41,0.2);
      transform: translateY(-2px);
    }

    .node.expanded { box-shadow: 0 0 0 3px rgba(168,197,160,0.4); }

    /* colour classes */
    .founder    { background: #fff3e0; border-color: #c8843c; }
    .son        { background: #e8f4f0; border-color: #4a7c6e; }
    .daughter   { background: #f0f7ee; border-color: #a8c5a0; }
    .son-in-law { background: #fdf6ee; border-color: #d4b896; }
    .dau-in-law { background: #eef4f0; border-color: #2d4a3e; }
    .deceased   { background: #f0ece8; border-color: #a09080; opacity: 0.75; }
    .creator    { background: #fff3e0; border-color: #c8843c; box-shadow: 0 0 0 3px rgba(200,132,60,0.35); }

    .node-name  { font-weight: 500; color: #1e3329; font-size: 12px; }

    /* ── VERTICAL CONNECTOR ── */
    .v-line {
      width: 2px;
      background: #a8c5a0;
      margin: 0 auto;
    }

    /* ── CHILDREN ROW ── */
    .children-wrap {
      display: none;
      flex-direction: column;
      align-items: center;
    }

    .children-wrap.visible { display: flex; }

    .children-row {
      display: flex;
      align-items: flex-start;
      gap: 0;
      position: relative;
    }

    /* horizontal line spanning children */
    .h-bar {
      position: absolute;
      top: 0;
      height: 2px;
      background: #a8c5a0;
    }

    /* each child column */
    .child-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 16px;
      position: relative;
    }

    /* ── TOOLBAR ── */
    .toolbar {
      position: fixed;
      bottom: 52px;
      right: 16px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      z-index: 99;
    }

    .tb-btn {
      width: 36px; height: 36px;
      background: #2d4a3e;
      color: #f5f0e8;
      border: none;
      border-radius: 4px;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .tb-btn:hover { background: #1e3329; }
    .tb-btn.small { font-size: 10px; letter-spacing: 0.03em; }

    /* ── LEGEND ── */
    .legend-wrap {
      position: fixed;
      bottom: 40px;
      left: 0; right: 0;
      z-index: 99;
      display: flex;
      justify-content: center;
      pointer-events: none;
    }

    .legend-inner {
      pointer-events: all;
      background: rgba(245,240,232,0.97);
      border: 1px solid #d4b896;
      border-radius: 6px 6px 0 0;
      overflow: hidden;
      font-size: 11px;
    }

    .legend-toggle {
      padding: 5px 20px;
      cursor: pointer;
      color: #2d4a3e;
      text-align: center;
      font-family: 'Tiro Devanagari Sanskrit', serif;
      border-bottom: 1px solid transparent;
      transition: background 0.2s;
    }

    .legend-toggle:hover { background: #ede8dc; }

    .legend-body {
      display: none;
      padding: 10px 16px;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      border-top: 1px solid #d4b896;
    }

    .legend-body.open { display: flex; }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #2d4a3e;
      white-space: nowrap;
    }

    .legend-dot {
      width: 14px; height: 14px;
      border-radius: 2px;
      border-width: 2px;
      border-style: solid;
      flex-shrink: 0;
    }

    /* ── SHOW ALL button ── */
    .show-all-btn {
      position: fixed;
      bottom: 52px;
      left: 16px;
      background: #2d4a3e;
      color: #f5f0e8;
      border: none;
      border-radius: 4px;
      padding: 6px 12px;
      font-size: 11px;
      font-family: 'Tiro Devanagari Sanskrit', serif;
      cursor: pointer;
      z-index: 99;
      transition: background 0.2s;
    }

    .show-all-btn:hover { background: #1e3329; }

    footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      text-align: center;
      padding: 10px 24px;
      background: #1e3329;
      border-top: 1px solid rgba(168,197,160,0.15);
      z-index: 100;
    }

    .footer-main {
      font-family: 'Tiro Devanagari Sanskrit', serif;
      font-size: 12px;
      color: #a8c5a0;
      letter-spacing: 0.04em;
    }

    .footer-creator {
      font-family: 'Tiro Devanagari Sanskrit', serif;
      font-size: 12px;
      color: #a8c5a0;
      text-decoration: none;
      transition: color 0.2s;
    }

    .footer-creator:hover { color: #f5f0e8; }

    .highlight-pulse {
      animation: pulse 1.5s ease 3;
    }

    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(200,132,60,0.6); }
      70%  { box-shadow: 0 0 0 10px rgba(200,132,60,0); }
      100% { box-shadow: 0 0 0 0 rgba(200,132,60,0); }
    }

        { id:'mrd_k', name:'Muralidhara ⚭', cls:'son', cousinMarriage:true,
          spouse:{ id:'smg_k', name:'Sumangala ⚭', cls:'dau-in-law', cousinMarriage:true },
          children:[{ id:'snd_k', name:'Sandesh', cls:'son' }] }
      ]},
    // 9. PRABHAKARA
    { id:'pbk', name:'Prabhakara', cls:'son',
      spouse:{ id:'kst', name:'Kasturi', cls:'dau-in-law' },
      children:[
        { id:'nvn', name:'Naveen', cls:'son',
          spouse:{ id:'swt', name:'Shwetha', cls:'dau-in-law' },
          children:[{ id:'abv', name:'Abhinav', cls:'son' }] },
        { id:'chet_p', name:'Chethana (P)', cls:'daughter',
          spouse:{ id:'chr', name:'Charan', cls:'son-in-law' },
          children:[{ id:'adt', name:'Adithi', cls:'daughter' }] }
      ]},
    // 10. SRIDHARA
    { id:'srd', name:'Sridhara', cls:'son',
      spouse:{ id:'ngv', name:'Nagaveni', cls:'dau-in-law' },
      children:[
        { id:'vkr', name:'Vikram', cls:'son',

            { id:'anp', name:'Anupama', cls:'creator' }

// ── BUILD DOM ─────────────────────────────────────────────────────────────────
const root = document.getElementById('tree-root');
let showAllState = false;

function buildNode(person, isFounder) {
  // Wrapper column for this person + their subtree
  const col = document.createElement('div');
  col.className = 'child-col';
  col.dataset.id = person.id;

  // Couple row (person + optional spouse)
  const coupleRow = document.createElement('div');
  coupleRow.className = 'couple-row';

  // Person node
  const nodeEl = document.createElement('div');
  nodeEl.className = 'node ' + person.cls;
  nodeEl.id = 'node-' + person.id;
  if (person.id === 'anp') nodeEl.id = 'creator';

  const hasChildren = person.children && person.children.length > 0;
  const hasSpouse   = !!person.spouse;

  if (hasChildren || (isFounder)) {
    nodeEl.classList.add('clickable');
    nodeEl.onclick = (e) => {
      e.stopPropagation();
      toggleNode(person, col);
    };
  }

  nodeEl.innerHTML = `<div class="node-name">${person.name}</div>`;
  coupleRow.appendChild(nodeEl);

  // Spouse node (hidden initially, shown when parent clicks this node)
  if (hasSpouse) {
    const conn = document.createElement('div');
    conn.className = 'couple-connector';
    conn.dataset.spouseConn = person.id;
    conn.style.display = 'none';
    coupleRow.appendChild(conn);

    const spouseEl = document.createElement('div');
    spouseEl.className = 'node ' + person.spouse.cls;
    spouseEl.id = 'node-' + person.spouse.id;
    spouseEl.dataset.spouseOf = person.id;
    spouseEl.style.display = 'none';
    spouseEl.innerHTML = `<div class="node-name">${person.spouse.name}</div>`;
    coupleRow.appendChild(spouseEl);
  }

  col.appendChild(coupleRow);

  // Children wrap (hidden initially)
  if (hasChildren) {
    const vLine = document.createElement('div');
    vLine.className = 'v-line';
    vLine.dataset.vlineOf = person.id;
    vLine.style.height = '30px';
    vLine.style.display = 'none';
    col.appendChild(vLine);

    const childrenWrap = document.createElement('div');
    childrenWrap.className = 'children-wrap';
    childrenWrap.dataset.childrenOf = person.id;

    const childrenRow = document.createElement('div');
    childrenRow.className = 'children-row';
    childrenRow.dataset.rowOf = person.id;

    for (const child of person.children) {
      const childCol = buildNode(child, false);
      childrenRow.appendChild(childCol);
    }

    childrenWrap.appendChild(childrenRow);
    col.appendChild(childrenWrap);
  }

  return col;
}

function toggleNode(person, col) {
  const hasChildren  = person.children && person.children.length > 0;
  const hasSpouse    = !!person.spouse;
  const nodeEl       = col.querySelector('.node');
  const isExpanded   = nodeEl.classList.contains('expanded');

  if (isExpanded) {
    // Collapse
    nodeEl.classList.remove('expanded');
    // Hide spouse
    if (hasSpouse) {
      const conn    = col.querySelector('[data-spouse-conn]');
      const spouseEl = col.querySelector('[data-spouse-of]');
      if (conn)    conn.style.display    = 'none';
      if (spouseEl) spouseEl.style.display = 'none';
    }
    // Hide children
    if (hasChildren) {
      const vLine       = col.querySelector('[data-vline-of]');
      const childrenWrap = col.querySelector('[data-children-of]');
      if (vLine)        vLine.style.display        = 'none';
      if (childrenWrap) childrenWrap.style.display  = 'none';
    }
  } else {
    // Expand
    nodeEl.classList.add('expanded');
    // Show spouse
    if (hasSpouse) {
      const conn     = col.querySelector(`[data-spouse-conn="${person.id}"]`);
      const spouseEl = col.querySelector(`[data-spouse-of="${person.id}"]`);
      if (conn)     conn.style.display     = 'flex';
      if (spouseEl) spouseEl.style.display = 'block';
    }
    // Show children
    if (hasChildren) {
      const vLine       = col.querySelector(`[data-vline-of="${person.id}"]`);
      const childrenWrap = col.querySelector(`[data-children-of="${person.id}"]`);
      if (vLine)        vLine.style.display        = 'block';
      if (childrenWrap) childrenWrap.style.display = 'flex';
    }
  }
}

function expandAll(person, col) {
  const hasChildren = person.children && person.children.length > 0;
  const hasSpouse   = !!person.spouse;
  const nodeEl      = col.querySelector(':scope > .couple-row > .node');

  if (!nodeEl) return;
  nodeEl.classList.add('expanded');

  if (hasSpouse) {
    const conn     = col.querySelector(`[data-spouse-conn="${person.id}"]`);
    const spouseEl = col.querySelector(`[data-spouse-of="${person.id}"]`);
    if (conn)     conn.style.display     = 'flex';
    if (spouseEl) spouseEl.style.display = 'block';
  }

  if (hasChildren) {
    const vLine        = col.querySelector(`[data-vline-of="${person.id}"]`);
    const childrenWrap = col.querySelector(`[data-children-of="${person.id}"]`);
    if (vLine)         vLine.style.display        = 'block';
    if (childrenWrap)  childrenWrap.style.display = 'flex';

    const childCols = childrenWrap.querySelectorAll(':scope > .children-row > .child-col');
    person.children.forEach((child, i) => {
      if (childCols[i]) expandAll(child, childCols[i]);
    });
  }
}

function collapseAll(person, col) {
  const hasChildren = person.children && person.children.length > 0;
  const hasSpouse   = !!person.spouse;
  const nodeEl      = col.querySelector(':scope > .couple-row > .node');

  if (!nodeEl) return;
  nodeEl.classList.remove('expanded');

  if (hasSpouse) {
    const conn     = col.querySelector(`[data-spouse-conn="${person.id}"]`);
    const spouseEl = col.querySelector(`[data-spouse-of="${person.id}"]`);
    if (conn)     conn.style.display     = 'none';
    if (spouseEl) spouseEl.style.display = 'none';
  }

  if (hasChildren) {
    const vLine        = col.querySelector(`[data-vline-of="${person.id}"]`);
    const childrenWrap = col.querySelector(`[data-children-of="${person.id}"]`);
    if (vLine)         vLine.style.display        = 'none';
    if (childrenWrap)  childrenWrap.style.display = 'none';

    const childCols = childrenWrap ? childrenWrap.querySelectorAll(':scope > .children-row > .child-col') : [];
    person.children.forEach((child, i) => {
      if (childCols[i]) collapseAll(child, childCols[i]);
    });
  }
}

function toggleAll() {
  const btn = document.querySelector('.show-all-btn');
  if (showAllState) {
    collapseAll(DATA, root.querySelector('.child-col'));
    btn.textContent = 'Show All';
    showAllState = false;
  } else {
    expandAll(DATA, root.querySelector('.child-col'));
    btn.textContent = 'Collapse All';
    showAllState = true;
  }
}

// ── LEGEND ───────────────────────────────────────────────────────────────────
function toggleLegend() {
  const body = document.getElementById('legend-body');
  const tog  = document.querySelector('.legend-toggle');
  body.classList.toggle('open');
  tog.textContent = body.classList.contains('open') ? '▼ Legend' : '▲ Legend';
}

// ── ZOOM ─────────────────────────────────────────────────────────────────────
let currentScale = 1;

function zoom(delta) {
  currentScale = Math.min(Math.max(currentScale + delta, 0.2), 2);
  root.style.transform = `scale(${currentScale})`;
}

function zoomFit() {
  const vp = document.getElementById('viewport');
  const rw = root.scrollWidth;
  const rh = root.scrollHeight;
  const vw = vp.clientWidth  - 80;
  const vh = vp.clientHeight - 80;
  currentScale = Math.min(vw / rw, vh / rh, 1);
  root.style.transform = `scale(${currentScale})`;
  root.style.transformOrigin = 'top center';
}

// ── INIT ─────────────────────────────────────────────────────────────────────
const founderCol = buildNode(DATA, true);
root.appendChild(founderCol);

// Creator link
if (location.hash === '#creator') {
  setTimeout(() => {
    const el = document.getElementById('creator');
    if (el) {
      expandAll(DATA, founderCol);
      showAllState = true;
      document.querySelector('.show-all-btn').textContent = 'Collapse All';
      setTimeout(() => {
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        el.classList.add('highlight-pulse');
      }, 300);
    }
  }, 200);
}
